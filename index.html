<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контрпики Dota 2</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <h1>Контрпики <span>Dota 2</span></h1>
  <div class="sub">Отметь героев врага и их позиции — покажу, кем и на какую позицию их ломать.</div>
  <div class="nav">
    <a class="active" href="index.html">Обычный режим</a>
    <a href="cm.html">Captain's Mode →</a>
  </div>
</header>

<main>
  <section class="card pad">
    <input type="search" id="q" placeholder="Поиск героя…" autocomplete="off">
    <div class="lbl">Моя позиция</div>
    <div class="chips" id="mypos"></div>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="card pad">
    <div class="hdr">
      <h2>Враги <span id="cnt" style="color:#39424f"></span></h2>
      <button class="clear" id="clear">сбросить</button>
    </div>
    <div class="slots" id="slots"></div>
    <div class="res" id="res"></div>
    <div class="note" id="note"></div>
  </aside>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function(){
  "use strict";
  const A = window.DOTA, H = A.H, N = A.N, POSN = A.POSN;
  const MAX = 5;

  let enemies = [];   // индексы героев
  let epos = [];      // их позиции 1..5
  let myPos = 0;      // своя позиция (0 = все)

  const $ = id => document.getElementById(id);
  const takenSet = () => new Set(enemies);

  function renderMyPos(){
    const box = $("mypos");
    box.innerHTML = "";
    const mk = (val, text, title) => {
      const c = document.createElement("div");
      c.className = "chip" + (myPos === val ? " on" : "");
      c.textContent = text;
      if (title) c.title = title;
      c.onclick = () => { myPos = val; renderAll(); };
      box.appendChild(c);
    };
    mk(0, "все", "Не фильтровать");
    for (let p = 1; p <= 5; p++) mk(p, String(p), "Позиция " + p + " — " + POSN[p]);
  }

  function renderGrid(){
    A.grid($("grid"), {
      q: $("q").value, pos: myPos, taken: takenSet(),
      onPick: addEnemy
    });
  }

  function renderSlots(){
    const box = $("slots");
    box.innerHTML = "";
    enemies.forEach((i, k) => {
      const el = document.createElement("div");
      el.className = "pick";
      el.title = "Убрать " + H[i].name;
      el.innerHTML = '<img src="' + A.img(i) + '"><div class="x">×</div>' +
        '<div class="posbadge" title="Позиция врага — клик, чтобы сменить">' + epos[k] + '</div>';
      el.querySelector("img").onclick = () => removeEnemy(k);
      el.querySelector(".posbadge").onclick = ev => {
        ev.stopPropagation();
        epos[k] = epos[k] % 5 + 1;
        renderAll();
      };
      box.appendChild(el);
    });
    for (let k = enemies.length; k < MAX; k++){
      const s = document.createElement("div");
      s.className = "slot";
      s.textContent = "—";
      box.appendChild(s);
    }
    $("cnt").textContent = enemies.length ? enemies.length + "/" + MAX : "";
  }

  function addEnemy(i){
    if (enemies.includes(i) || enemies.length >= MAX) return;
    enemies.push(i);
    epos.push(A.topPos(i));
    renderAll();
  }
  function removeEnemy(k){ enemies.splice(k, 1); epos.splice(k, 1); renderAll(); }

  function resultsFor(pos){
    const taken = takenSet();
    const rows = [];
    for (let c = 0; c < N; c++){
      if (taken.has(c)) continue;
      if (pos && !A.canPlay(c, pos)) continue;
      rows.push(A.score(c, enemies, epos));
    }
    rows.sort((a, b) => b.s - a.s);
    return rows;
  }

  function renderResults(){
    const res = $("res");
    res.innerHTML = "";
    if (!enemies.length){
      res.innerHTML = '<div class="empty">Пока никого не выбрал.<br>' +
        'Нажми на героев слева — до пяти.<br>' +
        'Клик по номеру на портрете меняет позицию врага.</div>';
      return;
    }
    if (myPos){
      const sect = document.createElement("div");
      sect.className = "sect";
      sect.innerHTML = '<h3>Позиция ' + myPos + ' — ' + POSN[myPos] + '</h3>';
      resultsFor(myPos).slice(0, 10).forEach(r => sect.appendChild(A.rowEl(r)));
      res.appendChild(sect);
      return;
    }
    for (let p = 1; p <= 5; p++){
      const rows = resultsFor(p).slice(0, 3);
      if (!rows.length) continue;
      const sect = document.createElement("div");
      sect.className = "sect";
      sect.innerHTML = '<h3>Позиция ' + p + ' — ' + POSN[p] + '</h3>';
      rows.forEach(r => sect.appendChild(A.rowEl(r)));
      res.appendChild(sect);
    }
  }

  function renderNote(){
    const m = A.D.meta;
    $("note").innerHTML =
      '<b>Как читать.</b> «п.п.» — на сколько процентных пунктов герой выигрывает ' +
      'против этих врагов чаще, чем ожидается от его же среднего уровня. Вес врага ' +
      'зависит от позиции: контрить керри и мидера важнее.<br><br>' +
      '<b>Позиции.</b> Выведены из линии и нетворса. В выдаче — герои, для которых ' +
      'твоя позиция одна из двух основных.<br><br>' +
      '<b>Данные.</b> ' + m.observations.toLocaleString("ru-RU") + ' парных наблюдений, ' +
      m.heroes + ' героев, срез ' + m.built + '. Сэмпл (~250 тыс. матчей) смещён в ' +
      'высокий MMR, поэтому цифры — ориентир.';
  }

  function renderAll(){
    renderMyPos();
    renderGrid();
    renderSlots();
    renderResults();
    renderNote();
    writeHash();
  }

  function readHash(){
    const raw = location.hash.slice(1);
    if (!raw) return;
    try {
      decodeURIComponent(raw).split(",").forEach(chunk => {
        const bits = chunk.trim().split(":");
        const i = A.byName.get(bits[0].toLowerCase());
        if (typeof i !== "number" || enemies.includes(i) || enemies.length >= MAX) return;
        let p = parseInt(bits[1], 10);
        if (!(p >= 1 && p <= 5)) p = A.topPos(i);
        enemies.push(i); epos.push(p);
      });
    } catch (e) { /* битая ссылка — игнорируем */ }
  }

  function writeHash(){
    try {
      const h = enemies.map((i, k) => H[i].name + ":" + epos[k]).join(",");
      history.replaceState(null, "", h ? "#" + encodeURIComponent(h) : location.href.split("#")[0]);
    } catch (e) { /* file:// — не критично */ }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape"){ enemies = []; epos = []; renderAll(); }
    if (e.key === "Backspace" && document.activeElement !== $("q") && enemies.length){
      enemies.pop(); epos.pop(); renderAll();
    }
  });
  $("clear").onclick = () => { enemies = []; epos = []; renderAll(); };
  $("q").oninput = renderGrid;

  readHash();
  renderAll();
})();
</script>
</body>
</html>
